[project]
name = "api-reliability-platform"
version = "1.0.0"
description = "An api test project"
readme = "README.md"
authors = [
    { name = "m6min", email = "88292388+m6min@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
api-reliability-platform = "api_reliability_platform:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
